name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma do build nativo no EAS
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: Perfil EAS (eas.json)
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck e export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Exportar bundle
        run: npx expo export --platform android --output-dir dist

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: expo-export
          path: dist
          if-no-files-found: error

  eas:
    name: EAS Build
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Defina o secret EXPO_TOKEN no repositório."
            echo "Crie o token em https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm ci

      - name: Disparar build no EAS
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
